<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Vista previa social — Rodolfo Alabarca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #151515;
    --border: #2c2a28;
    --text: #f4f1ec;
    --muted: #aaa49d;
    --accent: #c8834a;
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 1200px;
    height: 630px;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }

  .card {
    position: relative;
    display: grid;
    grid-template-columns: 58% 42%;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(circle at 16% 92%, rgba(200, 131, 74, 0.12), transparent 30%),
      var(--bg);
  }

  .card::before {
    position: absolute;
    z-index: 2;
    inset: 0;
    content: "";
    pointer-events: none;
    background:
      linear-gradient(90deg, transparent 0 52%, var(--bg) 58%, transparent 74%),
      linear-gradient(180deg, rgba(10, 10, 10, 0.08), rgba(10, 10, 10, 0.25));
  }

  .content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    padding: 58px 28px 48px 68px;
  }

  h1 {
    max-width: 660px;
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 65px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.045em;
  }

  h1 span {
    color: #b8b2aa;
    font-weight: 500;
  }

  .description {
    max-width: 600px;
    margin: 26px 0 0;
    color: var(--muted);
    font-size: 22px;
    line-height: 1.45;
  }

  .footer {
    position: absolute;
    bottom: 48px;
    left: 68px;
    display: flex;
    align-items: center;
    color: #d4cec7;
    font-size: 16px;
  }

  .footer-domain { color: var(--muted); }

  .portrait {
    position: relative;
    min-width: 0;
    overflow: hidden;
    background: var(--surface);
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 42% 68%;
    filter: saturate(0.78) contrast(1.08) brightness(0.84);
    transform: scale(1.15);
  }

  .portrait::after {
    position: absolute;
    inset: 0;
    content: "";
    background:
      linear-gradient(90deg, var(--bg), transparent 34%),
      linear-gradient(180deg, rgba(10, 10, 10, 0.18), transparent 45%, rgba(10, 10, 10, 0.3));
  }

  .frame {
    position: absolute;
    z-index: 4;
    inset: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }
</style>
</head>
<body>
  <main class="card">
    <section class="content">
      <div>
        <h1>Rodolfo Alabarca<br><span>Developer portfolio</span></h1>
        <p class="description">Hola, te invito a conocer un poco de mi trabajo como desarrollador y analista.</p>
      </div>

      <div class="footer">
        <span class="footer-domain">rodolfoalabarca.dev</span>
      </div>
    </section>

    <aside class="portrait" aria-hidden="true">
      <img src="assets/images/rodolfo.jpg" alt="">
    </aside>

    <div class="frame"></div>
  </main>
</body>
</html>
